name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    # Built on 22.04 so the binary also runs on Ubuntu 22.04/24.04 and newer Debian (glibc >= 2.35).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libx11-dev libxext-dev libxtst-dev libxfixes-dev libgtk-3-dev libvte-2.91-dev libsdl2-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      # Experimental viewer; built after the host so uuremote-server keeps the default features.
      - run: cargo build --release --locked --features native-viewer,viewer-sdl --bin uuremote-viewer
      - name: Build Ubuntu 18.04 X11 + GTK + VTE host
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            ubuntu:18.04 \
            bash -euxo pipefail -c '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential pkg-config curl ca-certificates \
                libx11-dev libxext-dev libxtst-dev libxfixes-dev libgtk-3-dev libvte-2.91-dev ffmpeg \
                xvfb openbox xauth x11-utils dbus-x11 xdotool python3 \
                xserver-xorg-core xserver-xorg-video-dummy x11-xserver-utils x11-apps \
                gnome-session-flashback gnome-panel metacity xserver-xorg-dev xutils-dev libtool xz-utils
              sh tests/install_ci_dummy.sh
              pkg-config --modversion gtk+-3.0
              pkg-config --modversion vte-2.91
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --default-toolchain 1.99.1 --profile minimal
              export PATH="$HOME/.cargo/bin:$PATH"
              export CARGO_TARGET_DIR=/workspace/target/ubuntu18.04
              rustc --version
              cargo build --release --locked

              binary="$CARGO_TARGET_DIR/release/uuremote-server"
              python3 tests/auto_virtual_display.py "$binary" /workspace/virtual-display-release-acceptance
              python3 tests/same_session_display.py "$binary" /workspace/same-session-release-acceptance
              ldd_output=/tmp/uuremote-server.ldd
              if ! ldd "$binary" > "$ldd_output"; then cat "$ldd_output"; exit 1; fi
              if grep -q "not found" "$ldd_output"; then cat "$ldd_output"; exit 1; fi
              grep -q "libgtk-3.so" "$ldd_output" || { cat "$ldd_output"; echo "GTK was not linked"; exit 1; }
              nm "$binary" > /tmp/uuremote-server.nm
              grep -q " uu_terminal_view_run$" /tmp/uuremote-server.nm || {
                echo "The terminal view symbol is missing from the binary"; exit 1;
              }
              echo "Resolved GTK and core dependencies:"
              grep -E "libgtk-3.so|libc\\.so|libstdc\\+\\+" "$ldd_output"
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto-virtual-display-release-acceptance
          path: |
            virtual-display-release-acceptance/**
            same-session-release-acceptance/**
          if-no-files-found: warn
      - name: Package
        run: |
          name=uu-remote-linux-${GITHUB_REF_NAME}-x86_64-linux
          mkdir -p "$name"
          cp target/release/uuremote-server target/release/uuremote-viewer LICENSE README.md README.en.md config.example.json "$name/"
          cp -r contrib "$name/"
          mkdir -p "$name/docs/release-notes"
          cp docs/ubuntu-18.04.md "$name/docs/"
          cp "docs/release-notes/${GITHUB_REF_NAME}.md" "$name/docs/release-notes/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          bionic_name=uu-remote-linux-${GITHUB_REF_NAME}-x86_64-ubuntu18.04
          mkdir -p "$bionic_name"
          cp target/ubuntu18.04/release/uuremote-server LICENSE README.md README.en.md config.example.json "$bionic_name/"
          cp -r contrib "$bionic_name/"
          mkdir -p "$bionic_name/docs/release-notes"
          cp docs/ubuntu-18.04.md "$bionic_name/docs/"
          cp "docs/release-notes/${GITHUB_REF_NAME}.md" "$bionic_name/docs/release-notes/"
          tar czf "$bionic_name.tar.gz" "$bionic_name"
          sha256sum "$bionic_name.tar.gz" > "$bionic_name.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/release-notes/${{ github.ref_name }}.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            uu-remote-linux-*.tar.gz
            uu-remote-linux-*.tar.gz.sha256

  # Headless NAS image (docker/), built from the release tarball published by the job above.
  docker:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker
          build-args: |
            VERSION=${{ github.ref_name }}
            REPOSITORY=${{ github.repository }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
